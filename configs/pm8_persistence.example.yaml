# Overlay: PM8 persistence knobs. Feature flag stays false in base YAML.
# postgresql mode requires BOTMODULEPROJECT1_DATABASE_URL and fails closed.

extends: base.example.yaml

pm8_persistence:
  operating_mode: memory
  storage_path: data/local/pm8
  schema_version: 2
  production_durable: false
  mt5_enabled: false
  broker_commands: false
  connect_timeout_seconds: 5
  statement_timeout_ms: 30000
  pool_min: 1
  pool_max: 8
  sslmode: prefer
  schema_name: public
  relay_batch_size: 50
  lease_timeout_seconds: 30
