# PM6 post-trade knobs. Flags stay false. Observe-only. Not orders.
# Enabling is BOTMODULEPROJECT1_FEATURE__ENABLE_PM6_POST_TRADE in test/research.

pm6_post_trade:
  operating_mode: shadow
  observe_only: true
  freshness_ttl_seconds: 300
  stale_ttl_seconds: 14400
  alert_dedup_seconds: 60
  incident_correlation_seconds: 300
  submit_burst: 8
  reject_burst: 6
  burst_window_seconds: 60
  silence_seconds: 600
  require_withdrawal_approval: true
  require_withdrawal_confirmation: true
  auto_rearm: false
  auto_complete_withdrawal: false
  mt5_enabled: false
  broker_commands: false
  durable: false
