# Public baseline configuration. No secrets.
# Secrets are referenced by environment variable name only.
# Process env must use BOTMODULEPROJECT1_ prefix (ADR-006 / Sequence 02).

profile: demo

app:
  name: BotModuleProject1
  environment: local
  timezone: UTC
  default_symbol: EURUSD

safety:
  trading_mode: demo
  live_trading_enabled: false
  fail_closed: true
  on_unknown_state: observe-only
  on_stale_data: observe-only
  on_incomplete_recovery: halt
  on_ledger_inconsistency: halt
  require_preflight: true
  require_readiness: true
  require_recovery: true
  require_risk_ready_before_orders: true

feature_flags:
  strategy_engine: false
  forecasting: false
  risk_engine: false
  execution: false
  pm5_simulation: false
  pm5_broker_adapter: false
  mt5_demo_execution: false
  live_execution: false
  telegram: false
  fine_tune_studio: false
  market_data: false
  live_trading: false
  pm6_post_trade: false
  pm6_surveillance: false
  pm6_incident_response: false
  pm6_governance: false
  pm6_withdrawal: false

logging:
  level: INFO
  json: true
  redact_secrets: true

clock:
  source: system
  aware: true
  utc_only: true

identity:
  require_event_id: true
  require_correlation_id: true
  require_causation_id: true
  require_idempotency_key_on_commands: true

mt5:
  enabled: false
  account_kind: demo
  terminal_path_env: MT5_TERMINAL_PATH
  login_env: MT5_LOGIN
  password_env: MT5_PASSWORD
  server_env: MT5_SERVER

persistence:
  enabled: false
  dsn_env: BOTMODULEPROJECT1_DATABASE_URL
  api_is_sole_durable_path: true

telegram:
  enabled: false
  token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  allowed_user_ids_env: TELEGRAM_ALLOWED_USER_IDS

model_registry:
  enabled: false
  uri_env: BOTMODULEPROJECT1_MODEL_REGISTRY_URI

notifications:
  enabled: false

paths:
  log_dir: logs
  data_dir: data/local

# PM2 knobs. The engine stays off until env opt-in in test/research.
pm2:
  universe:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
  timeframes:
    - M15
    - H1
    - H4
  decision_timeframe: H1
  lookback_bars: 64
  operating_mode: shadow
  ranking_mode: deterministic
  one_per_cluster: true
  ghost_tracking: true
  telemetry: true

# PM3-Strategy Engine knobs. Flag stays false. Observe-only. Not orders.
pm3_strategy_engine:
  operating_mode: shadow
  max_active_branches: 3
  require_handoff_eligibility: true
  universe:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
  enabled_templates:
    - trend_pullback
    - orb_session_breakout
    - mean_reversion
  go_threshold: 0.55
  edge_margin: 0.10
  min_selected_votes: 1
  conflict_no_trade: 0.35
  stale_ttl_hours: 4

# PM3 forecasting / QRF knobs. Flag stays false. Enrichment only. Not orders.
pm3_forecasting:
  horizon_bars: 4
  lookback_bars: 64
  min_samples: 20
  embargo_bars: 1
  timeframe: H1
  operating_mode: shadow
  observe_only: true

# PM4 Risk Gate knobs. Flag stays false. Deny-by-default. ALLOW is not an order.
pm4_risk_gate:
  operating_mode: shadow
  observe_only: true
  account_equity: "100000"
  max_per_trade_risk_pct: "0.005"
  max_open_risk_pct: "0.020"
  max_intraday_loss_pct: "0.015"
  max_daily_loss_pct: "0.020"
  one_per_cluster: true
  stale_ttl_seconds: 14400
  min_forecast_samples: 20
  auto_rearm: false
  recovery_cooldown_seconds: 300
  require_manual_recovery_after_kill: true
  risk_reducing_only_on_kill: true

# PM5 Execution knobs. Flags stay false. Simulation only when env-opted in test/research.
# No MT5, no broker adapter, no live path.
pm5_execution:
  operating_mode: disabled
  observe_only: true
  execution_policy: simulation_only
  stale_ttl_seconds: 14400
  max_retries: 2
  submit_burst: 8
  reject_burst: 6
  cancel_burst: 12
  auto_rearm: false
  broker_adapter_enabled: false
  mt5_enabled: false
  simulation_auto_fill: true
  recovery_cooldown_seconds: 300
  require_manual_recovery: true

# PM6 post-trade knobs. Flags stay false. Observe-only. Not orders.
pm6_post_trade:
  operating_mode: shadow
  observe_only: true
  freshness_ttl_seconds: 300
  stale_ttl_seconds: 14400
  alert_dedup_seconds: 60
  auto_rearm: false
  auto_complete_withdrawal: false
  mt5_enabled: false
  broker_commands: false
  durable: false

