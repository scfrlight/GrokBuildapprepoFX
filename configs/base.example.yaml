# Public baseline configuration. No secrets.
# Secrets are referenced by environment variable name only.
# Process env must use BOTMODULEPROJECT1_ prefix (ADR-006 / Sequence 02).

profile: demo

app:
  name: BotModuleProject1
  environment: local
  timezone: UTC
  default_symbol: EURUSD

safety:
  trading_mode: demo
  live_trading_enabled: false
  fail_closed: true
  on_unknown_state: observe-only
  on_stale_data: observe-only
  on_incomplete_recovery: halt
  on_ledger_inconsistency: halt
  require_preflight: true
  require_readiness: true
  require_recovery: true
  require_risk_ready_before_orders: true

feature_flags:
  strategy_engine: false
  forecasting: false
  risk_engine: false
  execution: false
  telegram: false
  fine_tune_studio: false
  market_data: false
  live_trading: false

logging:
  level: INFO
  json: true
  redact_secrets: true

clock:
  source: system
  aware: true
  utc_only: true

identity:
  require_event_id: true
  require_correlation_id: true
  require_causation_id: true
  require_idempotency_key_on_commands: true

mt5:
  enabled: false
  account_kind: demo
  terminal_path_env: MT5_TERMINAL_PATH
  login_env: MT5_LOGIN
  password_env: MT5_PASSWORD
  server_env: MT5_SERVER

persistence:
  enabled: false
  dsn_env: BOTMODULEPROJECT1_DATABASE_URL
  api_is_sole_durable_path: true

telegram:
  enabled: false
  token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  allowed_user_ids_env: TELEGRAM_ALLOWED_USER_IDS

model_registry:
  enabled: false
  uri_env: BOTMODULEPROJECT1_MODEL_REGISTRY_URI

notifications:
  enabled: false

paths:
  log_dir: logs
  data_dir: data/local

# PM2 knobs. The engine stays off until env opt-in in test/research.
pm2:
  universe:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
  timeframes:
    - M15
    - H1
    - H4
  decision_timeframe: H1
  lookback_bars: 64
  operating_mode: shadow
  ranking_mode: deterministic
  one_per_cluster: true
  ghost_tracking: true
  telemetry: true
