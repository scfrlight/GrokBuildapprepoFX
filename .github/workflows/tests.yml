name: kernel-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pm8
          POSTGRES_PASSWORD: pm8
          POSTGRES_DB: pm8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm8 -d pm8_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BOTMODULEPROJECT1_DATABASE_URL: postgresql://pm8:pm8@localhost:5432/pm8_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Interpreter
        run: python --version
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Pytest
        id: pytest
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m pytest tests --tb=short --junitxml=pytest-junit.xml > pytest.log 2>&1
          code=$?
          set -e
          echo "pytest_exit=$code" >> pytest.log
          tail -n 80 pytest.log
          test "$code" -eq 0
      - name: Evidence (restart drill + backup)
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/bot/emit_evidence.py --out-dir docs/evidence
      - name: PostgreSQL evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/bot/emit_pg_evidence.py
      - name: Sequence 14 evidence
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/bot/emit_seq14_evidence.py --out-dir docs/evidence/seq14
      - name: Doctor on supported interpreter
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m botmoduleproject1 doctor --profile test --config configs/test.example.yaml > doctor.out 2> doctor.err
          code=$?
          set -e
          test "$code" -eq 0
          grep -q "NOT TRADE READY" doctor.out
      - name: Upload evidence (after validation)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-py${{ matrix.python-version }}
          path: |
            pytest.log
            pytest-junit.xml
            doctor.out
            doctor.err
            docs/evidence/
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-py${{ matrix.python-version }}
          path: |
            pytest.log
            pytest-junit.xml
            doctor.out
            doctor.err

  seq14-hygiene:
    name: Sequence 14 safety hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Hygiene tests
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m pytest tests/unit/test_seq14_ci_hygiene.py tests/unit/test_seq14_docs.py tests/unit/test_numbering_map.py --tb=short > hygiene.log 2>&1
          code=$?
          set -e
          tail -n 40 hygiene.log
          test "$code" -eq 0
      - name: Live fail-closed
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m botmoduleproject1 live --profile test --config configs/test.example.yaml > live.out 2> live.err
          code=$?
          set -e
          echo "exit=$code"
          cat live.err
          test "$code" -eq 2
          grep -q "LIVE TRADING IS DISABLED" live.err
      - name: Docs paths
        run: |
          set -euo pipefail
          test -f docs/MODULE_NUMBERING_MAP.md
          test -f docs/TRACEABILITY_MATRIX.md
          test -f docs/observability/guide.md
          grep -F '| 00 |' docs/MODULE_NUMBERING_MAP.md
          grep -F '| 14 |' docs/MODULE_NUMBERING_MAP.md
          grep -F 'mt5_execution_engine' docs/MODULE_NUMBERING_MAP.md
          grep -F 'pm6_post_trade' docs/MODULE_NUMBERING_MAP.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: evidence-seq14-hygiene
          path: |
            hygiene.log
            live.out
            live.err

  doctor-py310-fail-fast:
    name: doctor fail-fast on CPython 3.10 (no deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Doctor must exit 1 before pydantic
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m botmoduleproject1 doctor --profile test --config configs/test.example.yaml > doctor.out 2> doctor.err
          code=$?
          set -e
          echo "exit=$code"
          echo "----- stderr -----"
          cat doctor.err
          echo "----- stdout -----"
          cat doctor.out
          test "$code" -eq 1
          grep -q "STARTUP FAILED" doctor.err
          grep -q "3.11" doctor.err
          grep -q "Python 3.10" doctor.err
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: evidence-doctor-py310
          path: |
            doctor.err
            doctor.out
